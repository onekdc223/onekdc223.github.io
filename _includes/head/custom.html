<!-- copy-permalink button: copies the post URL to the clipboard -->
<style>
  /* lay the title out as a row so the copy icon can sit at the far right */
  .page__title,
  .archive__item-title {
    display: flex;
    align-items: flex-start;
    gap: 0.5em;
  }
  /* let the "已複製" tooltip escape the listing title's clipping */
  .archive__item-title { overflow: visible; }

  .copy-permalink {
    flex: 0 0 auto;
    margin-left: auto;      /* push to the far right of the title row */
    align-self: flex-start;
    padding: 0.1em 0.2em;
    border: 0;
    background: none;
    color: inherit;
    opacity: 0.55;
    font-size: 0.8em;
    line-height: 1;
    cursor: pointer;
    position: relative;
    z-index: 20;            /* above the listing title link's z-index:10 flex-item stacking context */
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .copy-permalink:hover,
  .copy-permalink:focus-visible { opacity: 1; }
  .copy-permalink .fa-check { display: none; }
  .copy-permalink.is-copied { opacity: 1; color: #2ea44f; }
  .copy-permalink.is-copied .fa-link { display: none; }
  .copy-permalink.is-copied .fa-check { display: inline-block; }
  .copy-permalink.is-copied::after {
    content: "已複製";
    position: absolute;
    right: 0;
    bottom: calc(100% + 6px);
    white-space: nowrap;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.35em 0.55em;
    border-radius: 4px;
    pointer-events: none;
  }
</style>
<script>
  (function () {
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy") ? resolve() : reject();
        } catch (e) {
          reject(e);
        }
        document.body.removeChild(ta);
      });
    }

    document.addEventListener("click", function (event) {
      var btn = event.target.closest(".copy-permalink");
      if (!btn) return;
      event.preventDefault();
      var url = btn.getAttribute("data-copy-url");
      if (!url) return;
      copyText(url).then(function () {
        btn.classList.add("is-copied");
        window.setTimeout(function () {
          btn.classList.remove("is-copied");
        }, 1500);
      });
    });
  })();
</script>

<!-- reading progress bar: fills as the reader scrolls through the article body -->
<style>
  .reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    z-index: 9999;
    background: transparent;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .reading-progress.is-active { opacity: 1; }
  .reading-progress__bar {
    height: 100%;
    width: 100%;
    transform: scaleX(0);
    transform-origin: left center;
    background: linear-gradient(90deg, #00adb5, #00d4de);
    will-change: transform;
  }
  @media print { .reading-progress { display: none; } }
</style>
<script>
  (function () {
    function ready(fn) {
      if (document.readyState !== "loading") fn();
      else document.addEventListener("DOMContentLoaded", fn);
    }
    ready(function () {
      // 只在文章頁(single 版型才有的 .e-content 內文區)啟用
      var content = document.querySelector(".page__content.e-content");
      if (!content) return;

      var wrap = document.createElement("div");
      wrap.className = "reading-progress";
      wrap.setAttribute("aria-hidden", "true");
      var bar = document.createElement("div");
      bar.className = "reading-progress__bar";
      wrap.appendChild(bar);
      document.body.appendChild(wrap);

      var ticking = false;
      function update() {
        ticking = false;
        var winH = window.innerHeight || document.documentElement.clientHeight;
        var rect = content.getBoundingClientRect();
        var total = rect.height - winH;
        // 內文比視窗短、無需捲動時,不顯示進度條
        if (total <= 0) {
          wrap.classList.remove("is-active");
          return;
        }
        wrap.classList.add("is-active");
        var p = -rect.top / total;
        if (p < 0) p = 0;
        else if (p > 1) p = 1;
        bar.style.transform = "scaleX(" + p + ")";
      }
      function onScroll() {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(update);
        }
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll, { passive: true });
      update();
    });
  })();
</script>

<!-- mobile nav: 手機(<768px)時把所有導覽項目都收進漢堡,避免與長中文站名重疊 -->
<script>
  (function () {
    var MOBILE_MAX = 767; // 與 greedy-nav 的 <768 手機斷點一致
    var vlinks, hlinks, toggle;
    function collapse() {
      if (!vlinks) return;
      if (window.innerWidth <= MOBILE_MAX && vlinks.children.length) {
        // 把仍可見的項目依原順序移到漢堡最前面
        var items = Array.prototype.slice.call(vlinks.children);
        for (var i = items.length - 1; i >= 0; i--) {
          hlinks.insertBefore(items[i], hlinks.firstChild);
        }
        toggle.classList.remove("hidden");
        toggle.setAttribute("count", hlinks.children.length);
      }
    }
    function init() {
      var nav = document.querySelector("nav.greedy-nav");
      if (!nav) return;
      vlinks = nav.querySelector(".visible-links");
      hlinks = nav.querySelector(".hidden-links");
      toggle = nav.querySelector(".greedy-nav__toggle");
      if (!vlinks || !hlinks || !toggle) return;
      collapse();
      // greedy-nav 會在字型載入/resize 後把項目移回可見區;用 observer 確保手機下持續收合
      new MutationObserver(collapse).observe(vlinks, { childList: true });
      window.addEventListener("resize", function () {
        window.requestAnimationFrame(collapse);
      });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>

<!-- collapsible TOC(<1024px 側欄落入正文流時預設展開,可點標題收合)+ 回到頂部浮動鈕 -->
<style>
  /* 窄螢幕(側欄變內嵌)時,把目錄做成可點收合;預設展開 */
  @media (max-width: 1023px) {
    nav.toc header { position: relative; cursor: pointer; }
    nav.toc header .nav__title { padding-inline-end: 2.2em; }
    nav.toc header::after {
      content: "\25BE"; /* ▾ */
      position: absolute;
      inset-inline-end: 0.9em;
      top: 50%;
      transform: translateY(-50%);
      transition: transform 0.2s ease;
      pointer-events: none;
      opacity: 0.8;
    }
    nav.toc.is-collapsed header::after { transform: translateY(-50%) rotate(-90deg); }
    nav.toc.is-collapsed .toc__menu { display: none; }
  }

  /* 回到頂部浮動鈕 */
  .to-top-fab {
    position: fixed;
    inset-inline-end: 1rem;
    bottom: 1rem;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #00adb5;
    color: #fff;
    font-size: 1.35rem;
    line-height: 2.75rem;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    z-index: 900;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  .to-top-fab.is-visible { opacity: 0.9; visibility: visible; transform: none; }
  .to-top-fab:hover,
  .to-top-fab:focus-visible { opacity: 1; }
  @media print { .to-top-fab { display: none; } }
</style>
<script>
  (function () {
    // ---- 可收合目錄(<1024px)----
    (function () {
      var mq = window.matchMedia("(max-width: 1023px)");
      var entries = [];
      function wire() {
        document.querySelectorAll("nav.toc").forEach(function (toc) {
          var header = toc.querySelector("header");
          var title = toc.querySelector(".nav__title");
          if (!header || !title || toc._tocWired) return;
          toc._tocWired = true;
          function toggle() {
            var collapsed = toc.classList.toggle("is-collapsed");
            title.setAttribute("aria-expanded", String(!collapsed));
          }
          header.addEventListener("click", function () { if (mq.matches) toggle(); });
          title.addEventListener("keydown", function (e) {
            if (mq.matches && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(); }
          });
          entries.push({ toc: toc, title: title });
        });
      }
      function apply() {
        entries.forEach(function (o) {
          if (mq.matches) {
            o.toc.classList.remove("is-collapsed"); // 預設展開(仍可點標題收合)
            o.title.setAttribute("role", "button");
            o.title.setAttribute("tabindex", "0");
            o.title.setAttribute("aria-expanded", "true");
          } else {
            o.toc.classList.remove("is-collapsed"); // 桌機側欄永遠展開
            o.title.removeAttribute("role");
            o.title.removeAttribute("tabindex");
            o.title.removeAttribute("aria-expanded");
          }
        });
      }
      function init() { wire(); apply(); }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
      else init();
      mq.addEventListener ? mq.addEventListener("change", apply) : mq.addListener(apply);
    })();

    // ---- 回到頂部 ----
    (function () {
      function init() {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "to-top-fab";
        btn.setAttribute("aria-label", "回到頂部");
        btn.innerHTML = "↑"; // ↑
        document.body.appendChild(btn);
        var ticking = false;
        function update() {
          ticking = false;
          btn.classList.toggle("is-visible", window.pageYOffset > 400);
        }
        window.addEventListener("scroll", function () {
          if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
        }, { passive: true });
        btn.addEventListener("click", function () {
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
        });
        update();
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
      else init();
    })();
  })();
</script>
